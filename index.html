<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trippy Bird</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="game-panel">
        <div class="hud">
          <div class="badge">
            <span class="badge-label">Score</span>
            <span id="score" class="badge-value">0</span>
          </div>
          <div class="badge">
            <span class="badge-label">Best</span>
            <span id="best-score" class="badge-value">0</span>
          </div>
        </div>

        <canvas
          id="game"
          width="420"
          height="700"
          aria-label="Flappy Bird style game"
        ></canvas>

        <div id="overlay" class="overlay">
          <p class="eyebrow">Trippy Bird</p>
          <h1>Thread the portal.</h1>
          <p class="instructions">
            Press <strong>Space</strong>, click, or tap to jump. Pass the gates and
            let the trip intensify.
          </p>
          <button id="start-button" class="start-button" type="button">
            Start Trip
          </button>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
